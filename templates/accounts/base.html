<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122b2a">
  <title>{% block title %}ChitChat account{% endblock %}</title>
  <base href="{{ app_base_path }}">
  <link rel="stylesheet" href="static/chat/chat.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="wordmark" href="./" aria-label="ChitChat home">
        <span class="wordmark-mark" aria-hidden="true">C</span>
        <span>ChitChat<span class="wordmark-period">.</span></span>
      </a>
      {% include "chat/_account_nav.html" %}
      <div class="sidebar-bottom">
        <span class="privacy-dot" aria-hidden="true"></span>
        <span>Private workspace</span>
      </div>
    </aside>
    <main class="workspace account-workspace">
      <header class="topbar">
        <div class="topbar-context">
          <span class="eyebrow">LITECHAT ACCOUNT</span>
          <span class="topbar-title">Your private workspace</span>
        </div>
      </header>
      <section class="account-content">
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>
</body>
</html>
